{% extends 'base.html' %}

{% block title %}Create Account - Intelligent Expertise System{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 2rem auto;">
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 60px; height: 60px; border-radius: 50%; background: var(--grad-secondary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; font-size: 1.8rem; color: #FFF;">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h2>Register New Account</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Join the AI-Powered Intelligence Platform</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST">
            <div class="form-group">
                <label class="form-label"><i class="bi bi-person-fill"></i> Full Name</label>
                <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="bi bi-envelope-fill"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label"><i class="bi bi-key-fill"></i> Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="bi bi-shield-check"></i> Confirm Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Account Role</label>
                <select name="role" class="form-control">
                    <option value="user">Student / User</option>
                    <option value="admin">System Administrator</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">
                <i class="bi bi-rocket-takeoff-fill"></i> Create Account
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
            Already have an account? <a href="{{ url_for('auth.login') }}">Sign In Here</a>
        </div>
    </div>
</div>
{% endblock %}
