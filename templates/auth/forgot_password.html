{% extends 'base.html' %}

{% block title %}Reset Password - Intelligent Expertise System{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto;">
    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2>Reset Password</h2>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Enter your registered email to receive reset instructions</p>
        </div>

        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
            <div class="form-group">
                <label class="form-label"><i class="bi bi-envelope-fill"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="user@domain.com" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">
                Send Recovery Instructions
            </button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
            <a href="{{ url_for('auth.login') }}"><i class="bi bi-arrow-left"></i> Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
